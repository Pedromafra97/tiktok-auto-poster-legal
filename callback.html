<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok OAuth Callback</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; max-width: 640px; margin: 0 auto; padding: 40px 20px; line-height: 1.6; color: #1a1a1a; }
  h1 { font-size: 1.3em; }
  .box { background: #f4f4f4; border-radius: 8px; padding: 16px; margin-top: 16px; word-break: break-all; }
  .label { font-weight: 600; margin-top: 16px; }
  button { margin-top: 8px; padding: 8px 14px; cursor: pointer; }
</style>
</head>
<body>
<h1>TikTok OAuth callback received</h1>
<p>Copy the values below back into your test script.</p>

<div class="label">Authorization code:</div>
<div class="box" id="code">-</div>
<button onclick="copyText('code')">Copy code</button>

<div class="label">State:</div>
<div class="box" id="state">-</div>

<div class="label">Full URL:</div>
<div class="box" id="full">-</div>

<script>
  const params = new URLSearchParams(window.location.search);
  document.getElementById('code').textContent = params.get('code') || '(none)';
  document.getElementById('state').textContent = params.get('state') || '(none)';
  document.getElementById('full').textContent = window.location.href;

  function copyText(id) {
    navigator.clipboard.writeText(document.getElementById(id).textContent);
  }
</script>
</body>
</html>
